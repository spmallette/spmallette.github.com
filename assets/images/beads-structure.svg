<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">TinkerPop beads structure</title>
  <desc id="desc">A root bead with record, decision and task children. A chosen decision relates to its rejected alternative, task A was caused by the chosen decision, and task B is blocked by task A.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .tree { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
      .edge { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .elabel { font-size: 12px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .tlabel { font-size: 12px; fill: #6b7280; font-style: italic; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
      .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
      .title { font-size: 14px; fill: #111827; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #111827; }
      .root rect { fill: #1f2937; stroke: #1f2937; } .root .tag { fill: #d1d5db; } .root .title { fill: #fff; }
      .record rect { fill: #ffedd5; stroke: #c2410c; } .record .tag { fill: #9a3412; }
      .decision rect { fill: #fce7f3; stroke: #be185d; } .decision .tag { fill: #9d174d; }
      .rejected rect { fill: #f9fafb; stroke: #9ca3af; stroke-dasharray: 5 4; } .rejected .tag { fill: #6b7280; } .rejected .title { fill: #6b7280; }
      .task rect { fill: #dbeafe; stroke: #1d4ed8; } .task .tag { fill: #1e40af; }
      .merge rect { stroke-dasharray: 5 4; }
      rect { stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#fff"/>

  <!-- parent-child tree -->
  <path class="tree" d="M450,80 V120 M25,120 H875"/>
  <path class="tree" d="M25,120 V338 M25,178 H45 M25,258 H45 M25,338 H45"/>
  <path class="tree" d="M330,120 V418 M330,178 H350 M330,318 H350 M330,418 H350"/>
  <path class="tree" d="M875,120 V378 M875,178 H850 M875,278 H850 M875,378 H850"/>
  <text class="tlabel" x="160" y="114" text-anchor="middle">parent-child</text>
  <text class="tlabel" x="740" y="114" text-anchor="middle">parent-child</text>

  <!-- root -->
  <g class="root">
    <rect x="330" y="24" width="240" height="56" rx="10"/>
    <text class="tag" x="450" y="45" text-anchor="middle">root</text>
    <text class="title" x="450" y="66" text-anchor="middle">feature / epic / task</text>
  </g>

  <!-- records -->
  <g class="record">
    <rect x="45" y="150" width="245" height="56" rx="8"/>
    <text class="tag" x="59" y="171">record · JIRA</text>
    <text class="mono" x="59" y="192">TINKERPOP-3456</text>
  </g>
  <g class="record">
    <rect x="45" y="230" width="245" height="56" rx="8"/>
    <text class="tag" x="59" y="251">record · pull request</text>
    <text class="mono" x="59" y="272">apache/tinkerpop#2891</text>
  </g>
  <g class="record merge">
    <rect x="45" y="310" width="245" height="56" rx="8"/>
    <text class="tag" x="59" y="331">record · commit, at merge</text>
    <text class="mono" x="59" y="352">apache/tinkerpop@374b0c76d0</text>
  </g>

  <!-- decisions -->
  <g class="decision">
    <rect x="350" y="150" width="200" height="56" rx="8"/>
    <text class="tag" x="364" y="171">decision · chosen</text>
    <text class="title" x="364" y="192">Chose X</text>
  </g>
  <g class="rejected">
    <rect x="350" y="290" width="200" height="56" rx="8"/>
    <text class="tag" x="364" y="311">decision · rejected</text>
    <text class="title" x="364" y="332">Y</text>
  </g>
  <path class="edge" d="M450,206 V288"/>
  <text class="elabel" x="460" y="252">relates-to</text>

  <g class="decision">
    <rect x="350" y="390" width="200" height="56" rx="8"/>
    <text class="tag" x="364" y="411">decision · chosen, later</text>
    <text class="title" x="364" y="432">Chose Z</text>
  </g>
  <path class="edge" d="M550,418 H600 V198 H553"/>
  <text class="elabel" x="608" y="334">supersedes</text>

  <!-- tasks -->
  <g class="task">
    <rect x="650" y="150" width="200" height="56" rx="8"/>
    <text class="tag" x="664" y="171">task A</text>
    <text class="title" x="664" y="192">Implement X</text>
  </g>
  <g class="task">
    <rect x="650" y="250" width="200" height="56" rx="8"/>
    <text class="tag" x="664" y="271">task B</text>
    <text class="title" x="664" y="292">Waits for A</text>
  </g>
  <g class="task">
    <rect x="650" y="350" width="200" height="56" rx="8"/>
    <text class="tag" x="664" y="371">task C</text>
    <text class="title" x="664" y="392">No blocker, starts with A</text>
  </g>

  <path class="edge" d="M650,178 H552"/>
  <text class="elabel" x="601" y="170" text-anchor="middle">caused-by</text>

  <path class="edge" d="M750,250 V208"/>
  <text class="elabel" x="760" y="233">blocks</text>
</svg>
